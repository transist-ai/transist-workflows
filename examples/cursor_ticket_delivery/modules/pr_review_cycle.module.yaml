schema: transist.module.v1
id: cursor_pr_review_cycle
version: 0.1.0
modules:
  review_changes_flow: {path: pr_review_changes.module.yaml}
outputs:
  state: "{{steps.inspect_pr_state.out.pull_request.state}}"
  approval_ready: "{{steps.check_pr_exit_approvals.out.approval_ready}}"
  merge_ready: "{{steps.check_pr_exit_mergeability.out.merge_ready}}"
profiles:
  verify:
    uses: process:openspec/verify
    with:
      output_mode: compact
      max_context_file_bytes: 65536
      max_prompt_bytes: 98304
      ignore_paths: "{{inputs.ignore_paths}}"
      backend: "{{inputs.openspec_backend}}"
      model: "{{inputs.openspec_model}}"
      reasoning_effort: "{{inputs.openspec_reasoning_effort}}"
      timeout_ms: "{{inputs.openspec_timeout_ms}}"
      fail_on_mismatch: false
steps:
  - id: check_working_files
    uses: process:shell/exec
    with:
      command: python3
      args: [source://scripts/check_working_files.py, --repo-path, "{{inputs.repo_path}}"]
  - id: inspect_pr_comments
    uses: process:github.cli/pr_unresolved_comments
    with: {output_mode: compact, include_pr_conversation_comments: true, output_file: {$document: review_comments_raw, access: update}}
  - id: inspect_pr_state
    uses: process:github.cli/pr_view
    with: {output_mode: compact, output_file: {$document: pr, access: write}}
  - id: prepare_pending_review_comments
    uses: process:github.cli/pr_prepare_review_context
    with:
      output_mode: compact
      input_file: {$document: review_comments_raw, access: read}
      pr_file: {$document: pr, access: read}
      output_file: {$document: review_comments, access: write}
  - id: check_pr_exit_approvals
    uses: process:github.cli/pr_check_approvals
    with: {output_mode: compact, required_approvals: "{{inputs.required_pr_approvals}}", soft_fail: true, output_file: {$document: pr_approvals, access: write}}
  - id: check_pr_exit_mergeability
    uses: process:github.cli/pr_check_mergeability
    with: {output_mode: compact, output_file: {$document: pr_mergeability, access: write}}
  - id: maybe_check_pr_exit_validation
    control: control.noop
    if:
      guard: 'steps.check_pr_exit_approvals.out.approval_ready == true && steps.check_pr_exit_mergeability.out.merge_ready == true && steps.inspect_pr_state.out.pull_request.state != "MERGED"'
      then: [{ref: check_reviewer_context}, {ref: check_pr_exit_validation}]
  - id: check_reviewer_context
    uses: process:shell/exec
    with:
      command: python3
      args: [source://scripts/reviewer_context.py, capture, --file, {$document: reviewer_context, access: update}]
  - id: check_pr_exit_validation
    uses: process:openspec/verify
    profile: verify
    prompt_file: prompts/validate_changes.md
    with:
      change_name: "{{inputs.jira_ticket_id}}"
      context_files: [{$document: reviewer_context, access: read}, {$document: jira_issue, access: read}, {$document: attachment_context, access: read}, {$document: approved_plan, access: read}, {$document: approved_change, access: read}, {$document: implementation_notes, access: read}]
      report_file: {$document: validation_report, access: write}
  - id: maybe_render_validation_failure_comment
    control: control.noop
    if:
      guard: 'steps.check_pr_exit_approvals.out.approval_ready == true && steps.check_pr_exit_mergeability.out.merge_ready == true && steps.inspect_pr_state.out.pull_request.state != "MERGED" && steps.check_pr_exit_validation.out.passed != true'
      then: [{ref: render_validation_failure_comment}, {ref: upsert_validation_failure_comment}]
  - id: render_validation_failure_comment
    uses: process:shell/exec
    with:
      command: python3
      args: [source://scripts/render_validation_awareness_comment.py, --status, failed, --validation-report-file, {$document: validation_report, access: read}, --output-file, {$document: validation_awareness_comment, access: write}]
  - id: upsert_validation_failure_comment
    uses: process:github.cli/pr_comment_upsert
    with:
      output_mode: compact
      marker: "<!-- transist-validation-awareness -->"
      body_file: {$document: validation_awareness_comment, access: read}
      create_if_missing: true
      output_file: {$document: validation_awareness_result, access: write}
  - id: maybe_render_validation_resolved_comment
    control: control.noop
    if:
      guard: 'steps.check_pr_exit_approvals.out.approval_ready == true && steps.check_pr_exit_mergeability.out.merge_ready == true && steps.inspect_pr_state.out.pull_request.state != "MERGED" && steps.check_pr_exit_validation.out.passed == true'
      then: [{ref: render_validation_resolved_comment}, {ref: upsert_validation_resolved_comment}]
  - id: render_validation_resolved_comment
    uses: process:shell/exec
    with:
      command: python3
      args: [source://scripts/render_validation_awareness_comment.py, --status, resolved, --validation-report-file, {$document: validation_report, access: read}, --output-file, {$document: validation_awareness_comment, access: write}]
  - id: upsert_validation_resolved_comment
    uses: process:github.cli/pr_comment_upsert
    with:
      output_mode: compact
      marker: "<!-- transist-validation-awareness -->"
      body_file: {$document: validation_awareness_comment, access: read}
      create_if_missing: false
      output_file: {$document: validation_awareness_result, access: write}
  - id: should_pause_for_review
    control: control.noop
    if:
      guard: 'steps.inspect_pr_state.out.pull_request.state != "OPEN" || steps.check_pr_exit_approvals.out.approval_ready != true || steps.check_pr_exit_mergeability.out.merge_ready != true || steps.check_pr_exit_validation.out.passed != true'
      then: [{ref: review_cycle_decision}]
  - id: review_cycle_decision
    control: control.gate.manual
    with:
      gate_id: review-cycle-decision
      review_documents: [review_comments, pr, pr_approvals, pr_mergeability, validation_report]
      operator_guidance:
        conditions: {items: [Automated PR exit checks did not pass.]}
        decisions: {approve: [Exit despite unmet automated checks.], request_changes: Run one remediation cycle., reject: Stop the run.}
  - id: capture_review_cycle_decision
    uses: process:shell/exec
    gate_decision: {step: review_cycle_decision}
    with:
      command: python3
      args: [source://scripts/reviewer_context.py, capture, --file, {$document: reviewer_context, access: update}]
  - id: maybe_refresh_review_state
    control: control.noop
    if:
      guard: 'steps.review_cycle_decision.out.decision == "request_changes"'
      then: [{ref: check_working_files_before_refresh}, {ref: refresh_pr_comments}, {ref: refresh_pr_state}, {ref: merge_pending_review_comments}, {ref: write_operator_feedback}]
  - id: check_working_files_before_refresh
    uses: process:shell/exec
    with:
      command: python3
      args: [source://scripts/check_working_files.py, --repo-path, "{{inputs.repo_path}}"]
  - id: refresh_pr_comments
    uses: process:github.cli/pr_unresolved_comments
    with: {output_mode: compact, include_pr_conversation_comments: true, output_file: {$document: review_comments_raw, access: update}}
  - id: refresh_pr_state
    uses: process:github.cli/pr_view
    with: {output_mode: compact, output_file: {$document: pr, access: write}}
  - id: merge_pending_review_comments
    uses: process:github.cli/pr_prepare_review_context
    with:
      output_mode: compact
      input_file: {$document: review_comments_raw, access: read}
      pending_file: {$document: review_comments, access: read}
      pr_file: {$document: pr, access: read}
      output_file: {$document: review_comments, access: write}
  - id: write_operator_feedback
    uses: process:shell/exec
    gate_decision: {step: review_cycle_decision}
    with:
      command: python3
      args: [source://scripts/write_operator_feedback.py, --output-file, {$document: operator_feedback, access: write}]
  - id: maybe_review_exit_after_failed_validation
    control: control.noop
    if:
      guard: 'steps.review_cycle_decision.out.decision == "approved" && steps.check_pr_exit_approvals.out.approval_ready == true && steps.check_pr_exit_mergeability.out.merge_ready == true && steps.inspect_pr_state.out.pull_request.state != "MERGED" && steps.check_pr_exit_validation.out.passed != true'
      then: [{ref: review_exit_after_failed_validation}]
  - id: review_exit_after_failed_validation
    control: control.gate.manual
    with:
      gate_id: review-exit-after-failed-validation
      review_documents: [validation_report, validation_awareness_comment, validation_awareness_result]
      operator_guidance:
        conditions: {items: [OpenSpec reports a mismatch. A managed awareness comment was posted.]}
        decisions:
          approve: [Exit despite the mismatch.]
          request_changes: Stay in review and remediate using the validation report.
          reject: Stop the run.
  - id: capture_validation_override_decision
    uses: process:shell/exec
    gate_decision: {step: review_exit_after_failed_validation}
    with:
      command: python3
      args: [source://scripts/reviewer_context.py, capture, --file, {$document: reviewer_context, access: update}]
  - id: maybe_refresh_review_state_after_failed_validation
    control: control.noop
    if:
      guard: 'steps.review_exit_after_failed_validation.out.decision == "request_changes"'
      then: [{ref: check_working_files_before_validation_refresh}, {ref: refresh_pr_comments_after_failed_validation}, {ref: refresh_pr_state_after_failed_validation}, {ref: merge_pending_after_failed_validation}, {ref: capture_review_cycle_feedback_after_failed_validation}]
  - id: check_working_files_before_validation_refresh
    uses: process:shell/exec
    with:
      command: python3
      args: [source://scripts/check_working_files.py, --repo-path, "{{inputs.repo_path}}"]
  - id: refresh_pr_comments_after_failed_validation
    uses: process:github.cli/pr_unresolved_comments
    with: {output_mode: compact, include_pr_conversation_comments: true, output_file: {$document: review_comments_raw, access: update}}
  - id: refresh_pr_state_after_failed_validation
    uses: process:github.cli/pr_view
    with: {output_mode: compact, output_file: {$document: pr, access: write}}
  - id: merge_pending_after_failed_validation
    uses: process:github.cli/pr_prepare_review_context
    with:
      output_mode: compact
      input_file: {$document: review_comments_raw, access: read}
      pending_file: {$document: review_comments, access: read}
      pr_file: {$document: pr, access: read}
      output_file: {$document: review_comments, access: write}
  - id: capture_review_cycle_feedback_after_failed_validation
    uses: process:shell/exec
    gate_decision: {step: review_exit_after_failed_validation}
    with:
      command: python3
      args: [source://scripts/write_operator_feedback.py, --output-file, {$document: review_cycle_feedback, access: write}]
  - id: maybe_review_changes
    control: control.noop
    if:
      guard: '(steps.review_cycle_decision.out.decision == "request_changes" && steps.refresh_pr_state.out.pull_request.state != "MERGED") || (steps.review_exit_after_failed_validation.out.decision == "request_changes" && steps.refresh_pr_state_after_failed_validation.out.pull_request.state != "MERGED")'
      then: [{ref: review_changes_flow}]
  - id: review_changes_flow
    module: {ref: review_changes_flow, rerun_mode: fresh}
  - {id: finish, control: control.finish}
