schema: transist.flow.v1
id: diagnostic_advisory
version: 0.1.0
plugins:
  shell: 0.1.0
  openai.compatible: 0.1.0
inputs:
  workspace_path: {type: string, required: true}
  model: {type: string, required: true}
  source_path: {type: string, default: diagnostics.txt}
workspace:
  path: "{{inputs.workspace_path}}"
  access: read_only
network: {mode: none}
documents:
  diagnostic: {kind: file, max_bytes: 65536}
  response: {kind: file, max_bytes: 65536}
steps:
  - id: capture
    uses: process:shell/read_file
    with:
      path: "{{inputs.source_path}}"
      max_bytes: 65536
      output_mode: compact
      output_file: {$document: diagnostic, access: write}
  - id: review_diagnostic
    control: control.gate.manual
    with:
      gate_id: diagnostic-transfer
      review_documents: [diagnostic]
      destination: http://127.0.0.1:18765/v1
      operator_guidance:
        conditions:
          - Review this exact revision before transfer to the fake model. Advice only; no machine action.
        decisions:
          approve: Permit this diagnostic transfer.
          reject: Stop without a model call.
          request_changes: Reject and author a fresh run; no revision loop.
  - id: advise
    uses: process:openai.compatible/chat_complete
    network:
      mode: loopback
      allow_hosts: [127.0.0.1]
      allow_ports: [18765]
      tls_required: false
      max_redirects: 0
    with:
      base_url: http://127.0.0.1:18765/v1
      model: "{{inputs.model}}"
      system_prompt: Give at most three evidence-backed checks. Name missing information. Never execute or claim machine actions.
      user_text_file: {$document: diagnostic, access: read, reviewed_by: review_diagnostic}
      response_file: {$document: response, access: write}
      max_prompt_bytes: 98304
      max_tokens: 512
      timeout_ms: 30000
      secret_refs: [OPENAI_COMPATIBLE_API_KEY]
