name: Workflow checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: workflow-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONNOUSERSITE: '1'
  PYTHONPATH: ''

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.14'
      - name: Install pinned Python static tools
        run: python3 -m pip install -r requirements-dev.txt
      - name: Install checksum-verified static binaries
        env:
          STATIC_TOOLS: ${{ runner.temp }}/static-tools
        run: |
          set -euo pipefail
          mkdir -p "$STATIC_TOOLS"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            -o "$STATIC_TOOLS/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$STATIC_TOOLS/actionlint.tar.gz" | sha256sum --check -
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            -o "$STATIC_TOOLS/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          printf '%s  %s\n' 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e "$STATIC_TOOLS/gitleaks.tar.gz" | sha256sum --check -
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            -o "$STATIC_TOOLS/shellcheck.tar.gz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz
          printf '%s  %s\n' b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 "$STATIC_TOOLS/shellcheck.tar.gz" | sha256sum --check -
          tar -xzf "$STATIC_TOOLS/actionlint.tar.gz" -C "$STATIC_TOOLS" actionlint
          tar -xzf "$STATIC_TOOLS/gitleaks.tar.gz" -C "$STATIC_TOOLS" gitleaks
          tar -xzf "$STATIC_TOOLS/shellcheck.tar.gz" -C "$STATIC_TOOLS" --strip-components=1 shellcheck-v0.11.0/shellcheck
          printf '%s\n' "$STATIC_TOOLS" >> "$GITHUB_PATH"
      - name: Check source, formatting, lint and secrets
        env:
          BLACK_CACHE_DIR: ${{ runner.temp }}/black-cache
        run: python3 -B scripts/check_static.py
